<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bon Temps · Lafayette events</title>
<meta name="description" content="Bon Temps: live music, food, arts, wellness and family events around Lafayette, Louisiana, updated automatically.">
<meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1726" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bon Temps">
<meta property="og:title" content="Bon Temps">
<meta property="og:description" content="What's happening around Lafayette, LA, updated all day.">
<meta property="og:image" content="icon-512.png">
<script>try { const t = JSON.parse(localStorage.getItem("bt-theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (_) {}</script>
<style>
:root {
  /* Acadiana flag: flag blue, festival red, gold */
  --bg: #FAF8F3; --surface: #FFFFFF; --surface-2: #EEEBE3; --ink: #1B2433; --ink-2: #5C6575; --line: #E4E0D6;
  --brand: #1F5BA6; --brand-ink: #FFFFFF; --accent: #C62F3E; --gold: #F4B41A;
  --music: #C62F3E; --food: #A86B00; --arts: #6B4FA0; --wellness: #23855F; --family: #1F7FA6; --community: #5C6575;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1726; --surface: #172238; --surface-2: #1E2B44; --ink: #EEF2F8; --ink-2: #A3AEC2; --line: #2A3A57;
    --brand: #7AAAF0; --brand-ink: #0F1726; --accent: #FF6B78; --gold: #F4B41A;
    --music: #FF6B78; --food: #F4B41A; --arts: #B794DB; --wellness: #5CC79A; --family: #6BC6E0; --community: #A3AEC2;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1726; --surface: #172238; --surface-2: #1E2B44; --ink: #EEF2F8; --ink-2: #A3AEC2; --line: #2A3A57;
  --brand: #7AAAF0; --brand-ink: #0F1726; --accent: #FF6B78; --gold: #F4B41A;
  --music: #FF6B78; --food: #F4B41A; --arts: #B794DB; --wellness: #5CC79A; --family: #6BC6E0; --community: #A3AEC2;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

/* header */
header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; align-items: center; gap: 12px; padding: 14px 0 12px; }
.logo { display: flex; align-items: center; gap: 11px; text-decoration: none; flex: 1; min-width: 0; }
.logo img { flex: none; width: 38px; height: 38px; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); }
.logo b { display: block; font-size: 21px; line-height: 1.1; letter-spacing: -.02em; color: var(--brand); font-weight: 800; }
.logo small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { position: relative; flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 50%; color: var(--ink-2); }
.iconbtn[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.iconbtn .badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.iconbtn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.search { position: relative; display: block; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px 11px 40px; font-size: 16px; outline: none; -webkit-appearance: none; }
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-2); }
.filters { display: grid; gap: 10px; padding: 12px 0 12px; }
/* when: one even segmented control */
.seg { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface-2); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 7px 2px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* categories: one quiet scrolling row */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; margin: 0 -16px; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: none; border-radius: 999px; padding: 6px 11px; font-size: 14px; font-weight: 550; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--brand)) 14%, transparent); color: var(--c, var(--brand)); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip.sep { margin-left: 4px; box-shadow: inset 1px 0 0 var(--line); border-radius: 0 999px 999px 0; padding-left: 14px; }
.savedbar { display: flex; justify-content: space-between; align-items: center; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--ink); border-radius: 11px; padding: 9px 12px; font-weight: 600; font-size: 14px; }
.savedbar button { border: 0; background: none; color: var(--accent); font-weight: 650; }

/* list */
main { padding: 6px 0 40px; }
.day { position: sticky; top: var(--head-h, 170px); z-index: 5; background: var(--bg); padding: 14px 0 6px; font-weight: 750; font-size: 15px; display: flex; align-items: baseline; gap: 8px; }
.day span { color: var(--ink-2); font-weight: 500; font-size: 13.5px; }
.card { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 0; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; text-align: left; width: 100%; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--community)); }
.card:hover { border-color: color-mix(in srgb, var(--c, var(--line)) 50%, var(--line)); }
.card:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 40%, transparent); }
.when { text-align: right; font-weight: 700; font-size: 14px; padding-left: 8px; line-height: 1.2; }
.when small { display: block; color: var(--ink-2); font-weight: 500; font-size: 12px; margin-top: 2px; }
.info { min-width: 0; }
.info h3 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 650; }
.meta { color: var(--ink-2); font-size: 13.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); font-weight: 600; }
.tag.free { --c: var(--wellness); }
.save { border: 0; background: none; padding: 4px; color: var(--ink-2); border-radius: 8px; }
.save[aria-pressed="true"] { color: var(--accent); }
.empty { text-align: center; color: var(--ink-2); padding: 48px 12px; }
.more { display: block; margin: 16px auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 20px; }
details.ongoing { background: var(--surface-2); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0 4px; }
details.ongoing summary { cursor: pointer; font-weight: 650; font-size: 15px; }
details.ongoing .card { margin-top: 8px; }

/* footer */
footer { border-top: 1px solid var(--line); padding: 22px 0 calc(28px + env(safe-area-inset-bottom, 0px)); color: var(--ink-2); font-size: 14px; }
footer h4 { margin: 0 0 6px; color: var(--ink); font-size: 15px; }
.cta { display: inline-block; margin: 6px 0 18px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 999px; padding: 9px 16px; font-weight: 650; }

/* detail sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,20,20,.45); z-index: 40; }
.sheet { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.2); max-width: 640px; margin: 0 auto; }
@media (min-width: 700px) { .sheet { bottom: auto; top: 50%; transform: translateY(-50%); border-radius: 20px; max-height: 84vh; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet img.hero { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background: var(--surface-2); }
.sheet h2 { margin: 6px 0 4px; font-size: 22px; line-height: 1.25; }
.sheet .row { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; color: var(--ink); }
.sheet .row svg { flex: none; color: var(--ink-2); margin-top: 2px; }
.sheet p.desc { color: var(--ink); margin: 0; white-space: pre-line; }
.about { margin: 18px 0 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.about h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.desc.clamp.open { display: block; }
.readmore { border: 0; background: none; color: var(--brand); font-weight: 650; padding: 6px 0 0; }
.nodetails { background: var(--surface-2); border-radius: 12px; padding: 14px; margin: 18px 0 14px; }
.nodetails p { margin: 0 0 12px; color: var(--ink-2); font-size: 14.5px; }
.nodetails p b { color: var(--ink); font-weight: 600; }
.nodetails a { display: flex; justify-content: center; gap: 6px; background: var(--brand); color: var(--brand-ink); border-radius: 12px; padding: 11px; font-weight: 650; text-decoration: none; }
.sheet .src { font-size: 13px; color: var(--ink-2); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.actions a, .actions button { display: flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px; font-size: 14.5px; font-weight: 600; }
.actions .primary { grid-column: 1 / -1; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.close { position: absolute; right: 12px; top: 10px; border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 1; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; transition: .25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="./" aria-label="Bon Temps home">
        <img src="icon.svg" alt="">
        <span><b>Bon Temps</b><small id="updated">Lafayette, LA</small></span>
      </a>
      <button class="iconbtn" id="themebtn" type="button" aria-label="Switch to night mode"></button>
      <button class="iconbtn" id="savedbtn" type="button" aria-pressed="false" aria-label="Saved events">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-9C1.4 7.9 3.4 4.5 6.8 4.5c2 0 3.5 1.1 4.2 2.5h2c.7-1.4 2.2-2.5 4.2-2.5 3.4 0 5.4 3.4 4 6.5C19 15.6 12 20 12 20z"/></svg>
        <span class="badge" id="savedcount" hidden></span>
      </button>
      <button class="iconbtn" id="refresh" type="button" aria-label="Check for new events">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search bands, venues, events" autocomplete="off" aria-label="Search events">
    </label>
    <div class="filters" id="filters">
      <div class="seg" id="when" role="group" aria-label="When"></div>
      <div class="chips" id="cats" role="group" aria-label="Category"></div>
    </div>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>

<footer class="wrap">
  <h4>Know about something we missed?</h4>
  Bars, bands and organizers can add their events.<br>
  <a class="cta" id="submit" href="#" target="_blank" rel="noopener">Submit an event</a>
</footer>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Change this if your GitHub repository has a different name.
const REPO = "brobicheaux22/bon-temps";

const CATS = {
  music: "Music", food: "Food & Drink", arts: "Arts & Culture",
  wellness: "Wellness", family: "Family", community: "Community",
};
const WHEN = { today: "Today", tonight: "Tonight", weekend: "Weekend", week: "7 days", month: "30 days" };
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const PAGE = 120;

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("bt-" + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("bt-" + k, JSON.stringify(v)); } catch (_) {} },
};

const state = {
  data: null, lastFetch: 0, q: "",
  when: WHEN[store.get("when", "week")] ? store.get("when", "week") : "week", cats: new Set(store.get("cats", [])),
  free: false, saved: false, shown: PAGE,
};
const saved = new Set(store.get("saved", []));

// ---------- dates (events are stored in Lafayette local time) ----------
const parse = s => {
  if (!s) return null;
  const [d, t = "00:00"] = s.split("T");
  const [y, m, day] = d.split("-").map(Number); const [h, mi] = t.split(":").map(Number);
  return new Date(y, m - 1, day, h, mi);
};
// "now" in Lafayette, expressed the same way, so filters work wherever the viewer is
function lafNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return new Date(+p.year, p.month - 1, +p.day, +p.hour, +p.minute);
}
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtTime = d => { let h = d.getHours(), m = d.getMinutes(); const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return m ? `${h}:${String(m).padStart(2, "0")} ${ap}` : `${h} ${ap}`; };
const fmtDate = d => `${DOW[d.getDay()].slice(0, 3)}, ${MON[d.getMonth()]} ${d.getDate()}`;

function range(key) {
  const now = lafNow(), t0 = dayStart(now);
  switch (key) {
    case "today": return [now, addDays(t0, 1)];
    case "tonight": return [new Date(Math.max(now, new Date(t0).setHours(17))), new Date(addDays(t0, 1).setHours(3))];
    case "weekend": {
      const dow = t0.getDay(); // Fri 5pm → Sun night
      let fri = addDays(t0, (5 - dow + 7) % 7); if (dow === 6) fri = addDays(t0, -1); if (dow === 0) fri = addDays(t0, -2);
      const s = new Date(fri); s.setHours(17);
      return [new Date(Math.max(now, s)), addDays(fri, 3)];
    }
    case "week": return [now, addDays(t0, 8)];
    case "month": return [now, addDays(t0, 31)];
    default: return [now, addDays(t0, 400)];
  }
}

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const catColor = c => `var(--${c})`;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now"; if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60); if (h < 24) return `${h} hr ago`;
  return `${Math.round(h / 24)} days ago`;
}
const matches = (e, q) => !q || `${e.title} ${e.venue} ${e.desc} ${e.address} ${e.source}`.toLowerCase().includes(q);

// ---------- data ----------
async function load({ manual = false } = {}) {
  const btn = $("refresh"); btn.classList.add("spin");
  try {
    const res = await fetch(`events.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const before = state.data ? new Set(state.data.events.map(e => e.id)) : null;
    state.data = data; state.lastFetch = Date.now();
    if (before) {
      const fresh = data.events.filter(e => !before.has(e.id)).length;
      if (manual || fresh) toast(fresh ? `${fresh} new event${fresh > 1 ? "s" : ""} added` : "You're up to date");
    }
    render();
  } catch (err) {
    toast(navigator.onLine ? "Couldn't load events. Try again." : "You're offline");
    if (!state.data) $("main").innerHTML = `<div class="empty">Events couldn't load right now.<br><button class="more" onclick="load({manual:true})">Try again</button></div>`;
  } finally {
    setTimeout(() => btn.classList.remove("spin"), 300);
    updatedLabel();
  }
}
function updatedLabel() { $("updated").textContent = state.data ? `Lafayette, LA · Updated ${ago(state.data.updated)}` : "Lafayette, LA"; }

// ---------- render ----------
function filtered() {
  const [a, b] = state.saved ? range("all") : range(state.when);
  return state.data.events.filter(e => {
    if (state.saved && !saved.has(e.id)) return false;
    if (state.cats.size && !e.cats.some(c => state.cats.has(c))) return false;
    if (state.free && !e.free) return false;
    if (!matches(e, state.q)) return false;
    const s = parse(e.start), en = parse(e.end) || (e.allDay ? addDays(dayStart(s), 1) : new Date(+s + 2 * 3600e3));
    return en > a && s < b;
  });
}

function card(e) {
  const s = parse(e.start), c = e.cats[0] || "community";
  const when = e.ongoing ? `Thru<small>${MON[parse(e.end).getMonth()]} ${parse(e.end).getDate()}</small>`
    : e.allDay ? "All day" : `${fmtTime(s).replace(" ", "<small>")}</small>`;
  const tags = e.cats.map(k => `<span class="tag" style="--c:${catColor(k)}">${CATS[k]}</span>`).join("")
    + (e.free ? `<span class="tag free">Free</span>` : e.price ? `<span class="tag" style="--c:var(--ink-2)">${esc(e.price)}</span>` : "");
  return `<div class="card" role="button" tabindex="0" data-id="${e.id}" style="--c:${catColor(c)}">
    <div class="when">${when}</div>
    <div class="info"><h3>${esc(e.title)}</h3><div class="meta">${esc(e.venue || e.address || e.source)}</div><div class="tags">${tags}</div></div>
    <button class="save" type="button" data-save="${e.id}" aria-pressed="${saved.has(e.id)}" aria-label="${saved.has(e.id) ? "Unsave" : "Save"} ${esc(e.title)}">${heart(saved.has(e.id))}</button>
  </div>`;
}
const heart = on => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-9C1.4 7.9 3.4 4.5 6.8 4.5c2 0 3.5 1.1 4.2 2.5h2c.7-1.4 2.2-2.5 4.2-2.5 3.4 0 5.4 3.4 4 6.5C19 15.6 12 20 12 20z"/></svg>`;

function renderChips() {
  $("filters").hidden = state.saved;
  $("savedbtn").setAttribute("aria-pressed", state.saved);
  $("savedcount").hidden = !saved.size; $("savedcount").textContent = saved.size;
  $("when").innerHTML = Object.entries(WHEN).map(([k, v]) => `<button type="button" data-when="${k}" aria-pressed="${state.when === k}">${v}</button>`).join("");
  $("cats").innerHTML = `<button class="chip" type="button" data-cat="" aria-pressed="${!state.cats.size}">All</button>`
    + Object.entries(CATS).map(([k, v]) => `<button class="chip" type="button" data-cat="${k}" style="--c:${catColor(k)}" aria-pressed="${state.cats.has(k)}"><span class="dot"></span>${v}</button>`).join("")
    + `<button class="chip sep" type="button" data-free style="--c:var(--wellness)" aria-pressed="${state.free}">Free</button>`;
}

function render() {
  if (!state.data) return;
  renderChips();
  const list = filtered();
  const ongoing = list.filter(e => e.ongoing), dated = list.filter(e => !e.ongoing);
  let h = state.saved ? `<div class="savedbar">♥ Saved events (${saved.size})<button type="button" data-saved>Back to all</button></div>` : "";
  if (!list.length) {
    h += `<div class="empty">${state.saved ? "Nothing saved yet. Tap ♥ on an event to keep it here." : state.q ? `No events match “${esc(state.q)}”.` : "No events in this window. Try a wider range."}</div>`;
  } else {
    const now = lafNow(), today = dayStart(now);
    let last = "";
    dated.slice(0, state.shown).forEach(e => {
      const s = parse(e.start), d = dayStart(s < now ? now : s), key = d.toDateString();
      if (key !== last) {
        last = key;
        const diff = Math.round((d - today) / 864e5);
        const label = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : DOW[d.getDay()];
        h += `<div class="day">${label} <span>${MON[d.getMonth()]} ${d.getDate()}</span></div>`;
      }
      h += card(e);
    });
    if (dated.length > state.shown) h += `<button class="more" type="button" id="more">Show ${Math.min(PAGE, dated.length - state.shown)} more of ${dated.length - state.shown}</button>`;
    if (ongoing.length) h += `<details class="ongoing"><summary>Exhibits & ongoing (${ongoing.length})</summary>${ongoing.map(card).join("")}</details>`;
  }
  $("main").innerHTML = h;
  syncHead();
}


// ---------- detail sheet ----------
function calLinks(e) {
  const pad = n => String(n).padStart(2, "0");
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const t = d => `${f(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const s = parse(e.start);
  const en = parse(e.end) || new Date(+s + 2 * 3600e3);
  const dates = e.allDay ? `${f(s)}/${f(addDays(s, 1))}` : `${t(s)}/${t(en)}`;
  const g = "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: e.title, dates, ctz: "America/Chicago", location: [e.venue, e.address].filter(Boolean).join(", "), details: `${e.desc}\n\n${e.url}` });
  const icsEsc = x => String(x || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Bon Temps//EN", "BEGIN:VEVENT", `UID:${e.id}@bontemps`, `DTSTAMP:${t(new Date())}`,
    e.allDay ? `DTSTART;VALUE=DATE:${f(s)}` : `DTSTART;TZID=America/Chicago:${t(s)}`,
    e.allDay ? `DTEND;VALUE=DATE:${f(addDays(s, 1))}` : `DTEND;TZID=America/Chicago:${t(en)}`,
    `SUMMARY:${icsEsc(e.title)}`, `LOCATION:${icsEsc([e.venue, e.address].filter(Boolean).join(", "))}`, `DESCRIPTION:${icsEsc(e.desc + "\n" + e.url)}`, `URL:${e.url}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  return { google: g, ics: "data:text/calendar;charset=utf-8," + encodeURIComponent(ics) };
}

function openSheet(id) {
  const e = state.data.events.find(x => x.id === id); if (!e) return;
  const s = parse(e.start), en = parse(e.end);
  let when;
  if (e.ongoing) when = `${fmtDate(s)} – ${fmtDate(en)}`;
  else if (e.allDay) when = `${fmtDate(s)} · All day`;
  else when = `${fmtDate(s)} · ${fmtTime(s)}${en ? ` – ${fmtTime(en)}` : ""}`;
  const place = [e.venue, e.address].filter(Boolean).join(", ");
  const map = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place + " Lafayette LA");
  const cal = calLinks(e);
  // Descriptions that still look like code are hidden in favor of the "find more details" link.
  const looksLikeCode = /\[\/?[a-z_]+[\s\]]|[\w-]+="[^"]*"|<\/?[a-z]+[\s>]|\{"|":\s*"/.test(e.desc || "");
  const hasDetails = !looksLikeCode && (e.desc || "").trim().length >= 60;
  const ic = p => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  $("sheet").innerHTML = `<div class="grab"></div><button class="close" type="button" id="close" aria-label="Close">×</button>
    ${e.image ? `<img class="hero" src="${esc(e.image)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
    <div class="tags">${e.cats.map(k => `<span class="tag" style="--c:${catColor(k)}">${CATS[k]}</span>`).join("")}${e.free ? `<span class="tag free">Free</span>` : ""}</div>
    <h2 id="sheet-title">${esc(e.title)}</h2>
    <div class="row">${ic('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>')}<div>${when}</div></div>
    ${place ? `<div class="row">${ic('<path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>')}<div><a href="${map}" target="_blank" rel="noopener">${esc(place)}</a></div></div>` : ""}
    ${e.price && !e.free ? `<div class="row">${ic('<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>')}<div>${esc(e.price)}</div></div>` : ""}
    ${hasDetails
      ? `<section class="about"><h3>About this event</h3><p class="desc clamp" id="desc">${esc(e.desc)}</p><button type="button" class="readmore" id="readmore" hidden>Read more</button></section>`
      : `<div class="nodetails"><p>${e.desc && !looksLikeCode ? `<b>${esc(e.desc)}</b><br>` : ""}We don't have the full details for this one yet.</p>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">Find more details on the ${esc(sourceSite(e))} website ↗</a>` : ""}</div>`}
    <div class="src">From ${esc(e.source)}${e.alsoOn && e.alsoOn.length ? `, also on ${e.alsoOn.map(esc).join(", ")}` : ""}. Details can change, so check with the venue.</div>
    <div class="actions">
      ${e.url && hasDetails ? `<a class="primary" href="${esc(e.url)}" target="_blank" rel="noopener">Event page and tickets ↗</a>` : ""}
      <a href="${cal.google}" target="_blank" rel="noopener">Google Calendar</a>
      <a href="${cal.ics}" download="${esc(e.title.slice(0, 40).replace(/[^\w ]+/g, ""))}.ics">Apple / Outlook</a>
      <button type="button" data-save="${e.id}" aria-pressed="${saved.has(e.id)}">${saved.has(e.id) ? "♥ Saved" : "♡ Save"}</button>
      <button type="button" id="share">Share</button>
    </div>`;
  $("scrim").hidden = false; $("sheet").hidden = false; $("sheet").scrollTop = 0;
  const d = $("desc"); if (d && d.scrollHeight > d.clientHeight + 4) $("readmore").hidden = false;
  document.body.style.overflow = "hidden";
  history.replaceState(null, "", "#" + e.id);
  $("close").focus();
  $("close").onclick = closeSheet;
  $("share").onclick = async () => {
    const url = location.href.split("#")[0] + "#" + e.id;
    const text = `${e.title} · ${when}${place ? " · " + place : ""}`;
    try { if (navigator.share) await navigator.share({ title: e.title, text, url }); else { await navigator.clipboard.writeText(`${text}\n${url}`); toast("Link copied"); } } catch (_) {}
  };
}
// "Blue Moon Saloon" for a venue's own feed, the listing site's name otherwise
const sourceSite = e => e.source.replace(/\s*\(.*\)$/, "");
function closeSheet() {
  $("scrim").hidden = true; $("sheet").hidden = true; document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
}

function toggleSave(id) {
  if (saved.has(id)) { saved.delete(id); toast("Removed from saved"); } else { saved.add(id); toast("Saved"); }
  store.set("saved", [...saved]);
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b => {
    const on = saved.has(id); b.setAttribute("aria-pressed", on);
    if (b.classList.contains("save")) b.innerHTML = heart(on); else b.textContent = on ? "♥ Saved" : "♡ Save";
  });
  renderChips();
  if (state.saved) render();
}

// ---------- night mode ----------
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light")) === "dark";
function paintThemeButton() {
  const dark = isDark();
  $("themebtn").setAttribute("aria-label", dark ? "Switch to day mode" : "Switch to night mode");
  $("themebtn").innerHTML = dark
    ? `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = dark ? "#0F1726" : "#FAF8F3");
}
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  store.set("theme", next);
  paintThemeButton();
}
darkQuery.addEventListener?.("change", paintThemeButton);
paintThemeButton();

// ---------- events ----------
function syncHead() { document.documentElement.style.setProperty("--head-h", $("top").offsetHeight + "px"); }
addEventListener("resize", syncHead);

document.addEventListener("click", ev => {
  const t = ev.target.closest("button, .card, a"); if (!t) return;
  if (t.dataset.save) { ev.stopPropagation(); return toggleSave(t.dataset.save); }
  if (t.dataset.when) { state.when = t.dataset.when; state.shown = PAGE; store.set("when", state.when); return render(); }
  if ("saved" in t.dataset || t.id === "savedbtn") { state.saved = !state.saved; state.shown = PAGE; scrollTo(0, 0); return render(); }
  if ("cat" in t.dataset) { const c = t.dataset.cat; if (!c) state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c); store.set("cats", [...state.cats]); state.shown = PAGE; return render(); }
  if ("free" in t.dataset) { state.free = !state.free; return render(); }
  if (t.id === "more") { state.shown += PAGE; return render(); }
  if (t.id === "refresh") return load({ manual: true });
  if (t.id === "themebtn") return toggleTheme();
  if (t.id === "readmore") { const d = $("desc"); const open = d.classList.toggle("open"); t.textContent = open ? "Show less" : "Read more"; return; }
  if (t.classList.contains("card")) return openSheet(t.dataset.id);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("sheet").hidden) closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList?.contains("card")) { ev.preventDefault(); openSheet(ev.target.dataset.id); }
});
$("scrim").addEventListener("click", closeSheet);
let qt; $("q").addEventListener("input", ev => { clearTimeout(qt); qt = setTimeout(() => { state.q = ev.target.value.trim().toLowerCase(); state.shown = PAGE; render(); }, 120); });

// Keep it fresh: check again when the page comes back into view, and every 10 minutes while open.
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.lastFetch > 5 * 60e3) load(); });
setInterval(() => { if (!document.hidden) load(); }, 10 * 60e3);
setInterval(updatedLabel, 60e3);

$("submit").href = `https://github.com/${REPO}/issues/new?template=submit-event.yml`;
load().then(() => { const id = location.hash.slice(1); if (id && state.data) openSheet(id); });
</script>
</body>
